<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.png">
</head>
<body>

  <!-- Thanh điều hướng (tự tạo từ content.js) -->
  <header class="navbar" id="navbar">
    <a href="#top" class="brand" id="brand"></a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện sáng/tối"><i class="fa fa-moon-o"></i></button>
      <button class="icon-btn menu-btn" id="menuToggle" aria-label="Mở menu"><i class="fa fa-bars"></i></button>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero" id="hero"></section>

    <!-- Các phần còn lại được tạo bởi app.js -->
    <section class="section" id="about"></section>
    <section class="section alt" id="education"></section>
    <section class="section" id="awards"></section>
    <section class="section alt" id="skills"></section>
    <section class="section" id="projects"></section>
    <section class="section alt" id="hobbies"></section>
    <section class="section" id="foods"></section>
    <section class="section alt" id="contact"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Nội dung của bạn nằm trong content.js -->
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
